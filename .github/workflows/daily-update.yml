name: Update Financial Health Data

on:
  schedule:
    - cron: '0 5 * * *'  # 5 AM UTC daily
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Data Pipeline
        id: data_pipeline
        env:
          GOOGLE_TRENDS_API_KEY: ${{ secrets.GOOGLE_TRENDS_API_KEY }}
          # Optional but strongly recommended. Without it the BLS fetch uses the
          # anonymous v1 quota (25 requests/day counted PER IP), which shared CI
          # runners routinely exhaust before this job runs — unemployment was
          # offline for 23 consecutive days for exactly this reason.
          # Free key: https://data.bls.gov/registrationEngine/
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          HUD_API_KEY: ${{ secrets.HUD_API_KEY }}
        run: |
          set -e  # Exit on first error so failures are not silently swallowed

          # Create data directories if missing
          mkdir -p data/raw

          # Guard the index calculation before it touches published data.
          # These tests encode the accuracy claims the public methodology page
          # makes, so a regression here would make that page wrong.
          echo "::group::Index calculation tests"
          node scripts/test/barometer-indices.test.js
          node scripts/test/barometer-simulation.test.js
          echo "::endgroup::"

          # Fetch real economic data from BLS, FRED, Census, HUD APIs
          # Note: JCHS reference data is loaded from data/jchs-reference-2025.json
          echo "::group::Real data fetch"
          node scripts/fetch-real-data.js
          echo "::endgroup::"

          # Validate that the output file is non-empty and contains DASHBOARD_DATA.
          #
          # There is deliberately no fallback pipeline here any more. The old
          # fallback (fetch-trends.js + calculate-indices.js) filled every
          # `change` field with Math.random() and carried no provenance
          # metadata, so a failed real fetch silently replaced the published
          # dataset with invented movement figures. Serving yesterday's real
          # numbers — which the frontend labels as stale after 26 hours — is
          # strictly better than serving today's fabricated ones.
          if [ ! -s data/dashboard-data.js ] || ! grep -q "DASHBOARD_DATA" data/dashboard-data.js; then
            echo "::error::Real data fetch produced incomplete output. Keeping the last good dataset; the frontend will surface a staleness warning."
            exit 1
          fi

          # Ensure top-level rent_burden / fmr_2br / housing_wage fields are
          # present on every state so the Housing Policy Lab's Barometer sync
          # lights up 51/51 across all four target fields. Falls back to
          # NLIHC OOR 2025 for states the live APIs missed.
          echo "::group::Augment housing fields"
          node scripts/augment-housing-fields.js
          echo "::endgroup::"

          # Update Student Health Map Data (Young Adult Specific)
          echo "Updating Student Map Data..."
          node scripts/update-student-map.js || true

          # Keep the homepage's static fallback numbers (no-JS / SEO view)
          # in sync with the fresh barometer data
          node scripts/sync-home-fallbacks.js || true

          # Bake the approved Pledge Wall entries into data/pledges.js so the
          # wall paints real names immediately instead of waiting on Apps
          # Script. Fails soft — a wobbly backend keeps the previous snapshot.
          echo "::group::Pledge Wall snapshot"
          node scripts/snapshot-pledges.js
          echo "::endgroup::"

          # Same for published Ambassador Notes → data/posts.js. This backend is
          # the slow one, so the snapshot is what keeps /posts instant.
          echo "::group::Ambassador Notes snapshot"
          node scripts/snapshot-posts.js
          echo "::endgroup::"

          # Millionaire Mindset survey → data/reviews.js. Keeps the education
          # page's review wall and its headline counts in step with the public
          # sheet. Fails soft — the previous snapshot stands.
          echo "::group::Student reviews snapshot"
          node scripts/snapshot-reviews.js
          echo "::endgroup::"

          # Stamp a fresh ?v= cache-buster on every page that loads
          # dashboard-data.js. GitHub Pages ignores _headers, so without
          # this, browsers and the Cloudflare edge serve stale data for
          # hours after each update.
          node scripts/stamp-data-version.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ index.html barometer.html barometer-embed.html research.html housing-policy-lab.html judges/index.html pledge-wall.html posts.html

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "::notice::Data pipeline ran but produced no new data. Possible upstream data freeze."
          else
            git commit -m "📊 Update financial health data $(date +%Y-%m-%d)"
            git push
          fi

      - name: Write job summary
        if: always()
        run: |
          STATUS="${{ steps.data_pipeline.outcome }}"
          DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          echo "## Financial Health Data Update — ${DATE}" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" = "success" ]; then
            echo "✅ **Status:** Pipeline completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "$STATUS" = "failure" ]; then
            echo "❌ **Status:** Pipeline FAILED — dashboard-data.js was not updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action required:** Check the 'Update Data Pipeline' step logs above." >> $GITHUB_STEP_SUMMARY
            echo "The dashboard will continue serving the last successful data, but the" >> $GITHUB_STEP_SUMMARY
            echo "staleness check in the frontend will surface a warning to users." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Status:** ${STATUS}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Configured |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| GOOGLE_TRENDS_API_KEY | ${{ secrets.GOOGLE_TRENDS_API_KEY != '' && '✅' || '❌ missing' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BLS_API_KEY | ${{ secrets.BLS_API_KEY != '' && '✅' || '⚠️ missing — using shared anonymous quota' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FRED_API_KEY | ${{ secrets.FRED_API_KEY != '' && '✅' || '❌ missing' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CENSUS_API_KEY | ${{ secrets.CENSUS_API_KEY != '' && '✅' || '❌ missing' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HUD_API_KEY | ${{ secrets.HUD_API_KEY != '' && '✅' || '❌ missing' }} |" >> $GITHUB_STEP_SUMMARY
