<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 112" role="img" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ripeBody" x1="86%" y1="8%" x2="20%" y2="96%">
      <stop offset="0" stop-color="#FFCE5C"/>
      <stop offset=".42" stop-color="#FF9E14"/>
      <stop offset="1" stop-color="#EF5F12"/>
    </linearGradient>
    <radialGradient id="ripeBlush" cx="78%" cy="28%" r="56%">
      <stop offset="0" stop-color="#E5511B" stop-opacity=".6"/>
      <stop offset="1" stop-color="#E5511B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ripeShine" cx="34%" cy="34%" r="32%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ripeLeaf" x1="6%" y1="90%" x2="94%" y2="10%">
      <stop offset="0" stop-color="#4E9427"/>
      <stop offset="1" stop-color="#8FD14F"/>
    </linearGradient>
  </defs>

  <!-- stem and leaf sit behind the fruit so they tuck into the shoulder -->
  <path d="M126 42 C132 32, 135 26, 134 16" fill="none" stroke="#7A4A22" stroke-width="6" stroke-linecap="round"/>
  <path d="M132 20 C122 8, 106 6, 102 14 C98 23, 110 32, 124 29 C129 28, 132 24, 132 20 Z" fill="url(#ripeLeaf)"/>
  <path d="M120 26 C114 20, 108 16, 103 14" fill="none" stroke="#DCF2B8" stroke-width="1.6" stroke-linecap="round" opacity=".65"/>

  <!-- body: narrow beak at the stem, broad belly at the far end -->
  <path d="M128 44 C119 30, 96 22, 68 24 C38 26, 12 42, 9 66 C6 88, 30 106, 60 107 C92 108, 120 92, 129 70 C133 60, 133 51, 128 44 Z" fill="url(#ripeBody)"/>
  <path d="M128 44 C119 30, 96 22, 68 24 C38 26, 12 42, 9 66 C6 88, 30 106, 60 107 C92 108, 120 92, 129 70 C133 60, 133 51, 128 44 Z" fill="url(#ripeBlush)"/>
  <ellipse cx="48" cy="47" rx="22" ry="12" fill="url(#ripeShine)" transform="rotate(-20 48 47)"/>
</svg>
