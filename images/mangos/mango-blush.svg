<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 112" role="img" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="blushBody" x1="26%" y1="6%" x2="84%" y2="98%">
      <stop offset="0" stop-color="#C6DE4C"/>
      <stop offset=".32" stop-color="#FF9E14"/>
      <stop offset="1" stop-color="#DC4B10"/>
    </linearGradient>
    <radialGradient id="blushGlow" cx="68%" cy="76%" r="54%">
      <stop offset="0" stop-color="#B3341A" stop-opacity=".42"/>
      <stop offset="1" stop-color="#B3341A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blushShine" cx="46%" cy="30%" r="28%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blushLeaf" x1="94%" y1="90%" x2="6%" y2="10%">
      <stop offset="0" stop-color="#4E9427"/>
      <stop offset="1" stop-color="#8FD14F"/>
    </linearGradient>
  </defs>

  <!-- this one faces the other way, so a pile never reads as one shape repeated -->
  <path d="M14 42 C8 32, 5 26, 6 16" fill="none" stroke="#7A4A22" stroke-width="6" stroke-linecap="round"/>
  <path d="M8 20 C18 8, 34 6, 38 14 C42 23, 30 32, 16 29 C11 28, 8 24, 8 20 Z" fill="url(#blushLeaf)"/>
  <path d="M20 26 C26 20, 32 16, 37 14" fill="none" stroke="#DCF2B8" stroke-width="1.6" stroke-linecap="round" opacity=".65"/>

  <!-- body: slimmer, beak on the left -->
  <path d="M12 44 C21 30, 44 22, 72 24 C102 26, 128 42, 131 66 C134 88, 110 106, 80 107 C48 108, 20 92, 11 70 C7 60, 7 51, 12 44 Z" fill="url(#blushBody)"/>
  <path d="M12 44 C21 30, 44 22, 72 24 C102 26, 128 42, 131 66 C134 88, 110 106, 80 107 C48 108, 20 92, 11 70 C7 60, 7 51, 12 44 Z" fill="url(#blushGlow)"/>
  <ellipse cx="88" cy="46" rx="21" ry="11" fill="url(#blushShine)" transform="rotate(18 88 46)"/>
</svg>
