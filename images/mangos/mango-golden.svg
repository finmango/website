<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 112" role="img" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="goldBody" x1="80%" y1="10%" x2="24%" y2="94%">
      <stop offset="0" stop-color="#FFDD7A"/>
      <stop offset=".5" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#F5820C"/>
    </linearGradient>
    <radialGradient id="goldBlush" cx="26%" cy="84%" r="52%">
      <stop offset="0" stop-color="#E5511B" stop-opacity=".36"/>
      <stop offset="1" stop-color="#E5511B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldShine" cx="40%" cy="30%" r="30%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- stubby stem, no leaf — variety keeps the pile from looking cloned -->
  <path d="M116 38 C120 30, 121 25, 120 18" fill="none" stroke="#7A4A22" stroke-width="6" stroke-linecap="round"/>

  <!-- body: plumper, blunter beak -->
  <path d="M120 40 C110 26, 88 19, 62 21 C34 23, 10 40, 8 65 C6 89, 30 107, 62 107 C94 107, 122 91, 130 67 C134 56, 128 46, 120 40 Z" fill="url(#goldBody)"/>
  <path d="M120 40 C110 26, 88 19, 62 21 C34 23, 10 40, 8 65 C6 89, 30 107, 62 107 C94 107, 122 91, 130 67 C134 56, 128 46, 120 40 Z" fill="url(#goldBlush)"/>
  <ellipse cx="52" cy="44" rx="23" ry="12" fill="url(#goldShine)" transform="rotate(-17 52 44)"/>
</svg>
