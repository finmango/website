<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FinMango HQ — Team Workspace</title>
  <meta name="description" content="FinMango's internal team workspace — roadmap, boards, and wiki.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- The app is one stylesheet + one script, both long-lived and cached.
       Bump the ?v= on BOTH tags whenever either file changes so open tabs
       pick up the new build. No web fonts: the page renders in the platform
       font (SF Pro on Apple devices) with nothing to download first. -->
  <link rel="stylesheet" href="css/team-board.css?v=20261016">
  <link rel="preconnect" href="https://accounts.google.com">
  <!-- Google Identity Services — powers "Sign in with FinMango" (see docs/TEAM-BOARD-SETUP.md) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Social share card (iMessage, Slack, LinkedIn, X) -->
  <meta property="og:image" content="https://www.finmango.org/og-image.png?v=20260924">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="FinMango — Financial health should be a right.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.finmango.org/og-image.png?v=20260924">
</head>

<body>
  <!-- Sign-in gate: nothing below renders until you're in -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <img class="glogo" src="favicon.png" alt="FinMango" width="60" height="60">
      <div class="mono">FinMango Internal</div>
      <h1>FinMango HQ</h1>
      <p class="sub">Roadmap, boards &amp; wiki for the team. Sign in with your @finmango.org account.</p>
      <div class="gsi-wrap" id="gsiBtnGate"></div>
      <div id="gateKeyArea" style="display:none;">
        <div class="gate-key-row">
          <input id="gateKey" type="password" placeholder="Team key" aria-label="Team key">
          <button id="gateGo">Enter</button>
        </div>
      </div>
      <p class="gate-err" id="gateErr"></p>
      <a class="back" href="index.html">← finmango.org</a>
      <button class="gate-key-toggle" id="gateKeyToggle" aria-label="Enter with a team key">·</button>
    </div>
  </div>

  <div class="app" id="app" style="display:none;">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="side-head">
        <div class="ws-logo"><img src="favicon.png" alt="FinMango" width="38" height="38"></div>
        <div class="ws-name" id="wsName">FinMango HQ</div>
        <button class="kbd-hint" id="qfHint" title="Quick find" aria-label="Quick find">⌘K</button>
      </div>
      <div class="side-scroll">
        <div class="side-label">
          <span class="mono">Boards</span>
          <button id="addBoardBtn" title="New board" aria-label="New board">＋</button>
        </div>
        <div id="boardList"></div>
        <div class="side-label" id="pagesLabel">
          <span class="mono">Pages</span>
          <button id="addPageBtn" title="New page" aria-label="New page">＋</button>
        </div>
        <div id="pageList"></div>
        <div class="side-label"><span class="mono">Review</span></div>
        <button class="side-item" id="notesNavBtn"><span class="emoji">📝</span><span class="label">Ambassador Notes</span><span class="count" id="notesCount"></span></button>
        <button class="side-item" id="volNavBtn"><span class="emoji">🙋</span><span class="label">Volunteers</span><span class="count" id="volCount"></span></button>
      </div>
      <div class="side-foot">
        <button class="side-item" id="membersBtn"><span class="emoji">👥</span><span class="label">Team members</span></button>
        <button class="side-item" id="syncBtn"><span class="sync-dot" id="syncDot"></span><span class="label" id="syncLabel">Local only</span></button>
        <a class="side-item" href="index.html" style="text-decoration:none;"><span class="emoji">←</span><span class="label">finmango.org</span></a>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="main">
      <div class="topbar" id="topbar">
        <button class="hamburger" id="hamburger" aria-label="Toggle sidebar">☰</button>
        <div class="crumb">
          <span class="board-emoji" id="boardEmoji" title="Change icon">🥭</span>
          <input id="boardNameInput" value="" aria-label="Name" />
        </div>
        <button class="icon-btn" id="boardMenuBtn" title="Options">⋯</button>
        <div class="spacer"></div>
        <div class="view-switch board-only" role="tablist" aria-label="Board view">
          <button id="viewBoardBtn" class="active" role="tab" aria-selected="true">Board</button>
          <button id="viewTableBtn" role="tab" aria-selected="false">Table</button>
        </div>
        <div class="view-switch page-only">
          <button id="pageSrcBtn" aria-pressed="false" title="Raw markdown — for bulk edits and big restructures">Source</button>
        </div>
        <button class="top-filter board-only" id="agendaBtn" title="Show cards flagged for the next leadership call, plus everything in Now">📞 Agenda</button>
        <div class="search-box board-only">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="searchInput" placeholder="Filter…" aria-label="Filter cards" />
        </div>
        <div class="avatars" id="topAvatars"></div>
      </div>
      <div id="viewRoot" style="flex:1; display:flex; flex-direction:column; min-height:0;"></div>
    </main>
  </div>

  <div class="overlay" id="overlay"><div class="modal" id="modalBox" role="dialog" aria-modal="true" tabindex="-1"></div></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/team-board.js?v=20261016" defer></script>
</body>

</html>
