<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Share card - Barrier Breakers</title>
    <!-- Source for barrier-breakers-og.png. Render at exactly 1200x630:
         chrome --headless --window-size=1200,630 --screenshot=barrier-breakers-og.png barrier-breakers-og.html -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,900&display=swap" rel="stylesheet">
    <style>
        @page { size: 1200px 630px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 1200px; height: 630px; overflow: hidden; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0A0A0A;
            color: #fff;
            position: relative;
        }
        .photo {
            position: absolute; inset: 0;
            background: url('images/barrier-breakers-2026/img_3825.webp') center 35% / cover no-repeat;
        }
        .shade {
            position: absolute; inset: 0;
            background:
                linear-gradient(90deg, rgba(10,10,10,.96) 0%, rgba(10,10,10,.92) 38%, rgba(10,10,10,.55) 62%, rgba(10,10,10,.15) 100%),
                linear-gradient(180deg, rgba(10,10,10,.25) 0%, rgba(10,10,10,0) 40%, rgba(10,10,10,.55) 100%);
        }
        .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #F25A27; }
        .content { position: absolute; left: 72px; top: 64px; right: 72px; bottom: 56px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { height: 44px; width: auto; align-self: flex-start; filter: brightness(0) invert(1); display: block; }
        .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #F25A27; margin-bottom: 18px; }
        h1 { font-size: 118px; font-weight: 900; line-height: .92; letter-spacing: -.045em; }
        .sub { font-size: 34px; font-weight: 500; color: rgba(255,255,255,.82); margin-top: 22px; letter-spacing: -.01em; }
        .line { font-size: 24px; font-weight: 500; color: rgba(255,255,255,.62); margin-top: 14px; }
        .line b { color: #fff; font-weight: 700; }
        .foot { display: flex; justify-content: space-between; align-items: flex-end; }
        .url { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
        .url span { color: #F25A27; }
        .where { font-size: 20px; font-weight: 500; color: rgba(255,255,255,.6); }
    </style>
</head>
<body>
    <div class="photo"></div>
    <div class="shade"></div>
    <div class="bar"></div>
    <div class="content">
        <img class="logo" src="finmango.png" alt="FinMango">
        <div>
            <div class="eyebrow">Financial Health Innovation Challenge · 2027</div>
            <h1>Barrier<br>Breakers</h1>
            <div class="sub">High school teams build fixes for the costs that hold families back.</div>
            <div class="line"><b>60-second pitch.</b> Three judges. <b>Five teams</b> make Demo Day.</div>
        </div>
        <div class="foot">
            <div class="url">finmango.org<span>/barrier-breakers</span></div>
            <div class="where">Northeast Ohio</div>
        </div>
    </div>
</body>
</html>
