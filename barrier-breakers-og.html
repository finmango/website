<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Share card - Barrier Breakers</title>
    <!-- Source for barrier-breakers-og.png. Render at exactly 1200x630:
         chrome --headless --window-size=1200,630 --screenshot=barrier-breakers-og.png barrier-breakers-og.html -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap" rel="stylesheet">
    <style>
        @page { size: 1200px 630px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 1200px; height: 630px; overflow: hidden; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #FAFAF7;
            color: #0A0A0A;
            display: grid;
            grid-template-columns: 540px 1fr;
        }
        .copy {
            padding: 60px 56px 56px 64px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .logo { height: 40px; width: auto; align-self: flex-start; display: block; }
        h1 { font-size: 104px; font-weight: 700; line-height: .95; letter-spacing: -.045em; }
        .sub { font-size: 27px; font-weight: 500; line-height: 1.35; color: rgba(10,10,10,.62); margin-top: 26px; max-width: 420px; letter-spacing: -.01em; }
        .url { font-size: 22px; font-weight: 700; color: #F25A27; letter-spacing: -.01em; }
        .photo {
            background: url('images/barrier-breakers-2026/img_3829.webp') 42% 18% / cover no-repeat;
        }
    </style>
</head>
<body>
    <div class="copy">
        <img class="logo" src="finmango.png" alt="FinMango">
        <div>
            <h1>Barrier<br>Breakers</h1>
            <p class="sub">A high school entrepreneurship competition in Northeast Ohio.</p>
        </div>
        <div class="url">finmango.org/barrier-breakers</div>
    </div>
    <div class="photo"></div>
</body>
</html>
