<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2100">
    <title>FinMango — LinkedIn Company Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --orange: #F25A27;
            --ink: #0A0A0A;
            --paper: #FAFAF7;
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #222;
            overflow: hidden;
        }

        /*
         * LinkedIn company page cover — 6:1 ratio.
         * Designed at 2100 x 350, captured at 2x = 4200 x 700 (LinkedIn's recommended upload size).
         * LinkedIn displays it at roughly 940-1128 px wide, so every design px shrinks ~2.2x:
         *   - keep type big (nothing under ~26px here) or it turns to fuzz
         *   - the page logo overlaps the bottom-left corner, so the photo lives there
         *   - the edges get trimmed, so the headline stays 200px clear of the right side
         */
        .banner {
            width: 2100px;
            height: 350px;
            position: relative;
            overflow: hidden;
            background: var(--ink);
            font-family: var(--font-body);
        }

        /* Photo, left */
        .photo {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 980px;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 45%;
            display: block;
        }

        /* Fade the photo into the black panel */
        .photo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(10, 10, 10, 0) 55%, rgba(10, 10, 10, 0.6) 80%, var(--ink) 100%);
        }

        /* Warm glow behind the headline */
        .glow {
            position: absolute;
            width: 1200px;
            height: 800px;
            right: -100px;
            top: -250px;
            background: radial-gradient(closest-side, rgba(242, 90, 39, 0.20), rgba(242, 90, 39, 0));
            pointer-events: none;
        }

        /* Orange accent bar along the top edge */
        .accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: var(--orange);
        }

        /* Headline block, right */
        .copy {
            position: absolute;
            left: 1000px;
            right: 200px;
            top: 50%;
            transform: translateY(-50%);
        }

        h1 {
            font-family: var(--font-body);
            font-weight: 800;
            font-size: 112px;
            line-height: 0.96;
            letter-spacing: -0.045em;
            color: #fff;
            white-space: nowrap;
        }

        h1 em {
            font-style: normal;
            color: var(--orange);
            position: relative;
            display: inline-block;
        }

        h1 em svg.hand-stroke {
            position: absolute;
            left: -1%;
            bottom: -0.06em;
            width: 102%;
            height: 0.14em;
            pointer-events: none;
        }

        h1 em svg.hand-stroke path {
            stroke: var(--orange);
            stroke-width: 5;
            stroke-linecap: round;
            fill: none;
            opacity: 0.6;
        }

        .sub {
            margin-top: 26px;
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 26px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.72);
            display: flex;
            align-items: center;
            gap: 22px;
            white-space: nowrap;
        }

        .sub .sep {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--orange);
        }

        .sub .url {
            color: #fff;
        }
    </style>
  <!-- Social share card (iMessage, Slack, LinkedIn, X) -->
  <meta property="og:image" content="https://www.finmango.org/og-image.png?v=20260924">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="FinMango — Financial health should be a right.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.finmango.org/og-image.png?v=20260924">
</head>

<body>
    <div class="banner" id="capture">
        <div class="photo">
            <img src="hero.jpg" alt="">
        </div>
        <div class="glow"></div>
        <div class="accent"></div>

        <div class="copy">
            <h1>Financial health<br>should be <em>a right<svg class="hand-stroke" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M4 8 C 50 3, 110 10, 160 6 S 260 4, 296 7"/></svg></em>.</h1>
            <div class="sub">
                <span>Research</span><span class="sep"></span>
                <span>Education</span><span class="sep"></span>
                <span>Advocacy</span><span class="sep"></span>
                <span class="url">finmango.org</span>
            </div>
        </div>
    </div>
</body>

</html>
