<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2100">
    <title>FinMango — LinkedIn Company Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,800&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --orange: #F25A27;
            --orange-deep: #C2410C;
            --ink: #0A0A0A;
            --paper: #FAFAF7;
            --muted: #6B6B66;
            --line: rgba(10, 10, 10, 0.12);
            --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #222;
            overflow: hidden;
        }

        /*
         * LinkedIn company page cover — 6:1 ratio.
         * Designed at 2100 x 350, captured at 2x = 4200 x 700 (LinkedIn's recommended upload size).
         * Displayed on desktop at ~1128 x 191. Safe zones:
         *   - LinkedIn trims the left and right edges even on desktop, so nothing
         *     important sits within ~200px (10%) of either side
         *   - the page logo overlaps the bottom-left corner on desktop
         *   - mobile crops further, so the headline and stats sit in the middle band
         */
        .banner {
            width: 2100px;
            height: 350px;
            position: relative;
            overflow: hidden;
            background: var(--paper);
            font-family: var(--font-body);
            color: var(--ink);
        }

        /* Warm glow behind the headline, same as the homepage hero */
        .glow {
            position: absolute;
            width: 1100px;
            height: 700px;
            left: 120px;
            top: -200px;
            background: radial-gradient(closest-side, rgba(242, 90, 39, 0.16), rgba(242, 90, 39, 0));
            pointer-events: none;
        }

        .glow.two {
            width: 800px;
            height: 600px;
            left: auto;
            right: -120px;
            top: -120px;
            background: radial-gradient(closest-side, rgba(242, 90, 39, 0.10), rgba(242, 90, 39, 0));
        }

        /* Fine dot grid texture */
        .grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(10, 10, 10, 0.09) 1.2px, transparent 1.2px);
            background-size: 28px 28px;
            mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.25) 55%, rgba(0, 0, 0, 0.9));
            -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.25) 55%, rgba(0, 0, 0, 0.9));
            pointer-events: none;
        }

        /* Thin rules framing the strip, like the homepage section dividers */
        .rule {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--line);
        }

        .rule.top { top: 22px; }
        .rule.bottom { bottom: 22px; }

        /* Orange accent bar along the top edge */
        .accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: var(--orange);
        }

        /* Wordmark, top-left */
        .logo {
            position: absolute;
            left: 200px;
            top: 50px;
            height: 72px;
        }

        .logo img {
            height: 100%;
            width: auto;
            display: block;
        }

        /* Headline block */
        .copy {
            position: absolute;
            left: 450px;
            top: 50%;
            transform: translateY(-50%);
            width: 600px;
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 17px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--orange-deep);
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .eyebrow::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--orange);
        }

        h1 {
            font-family: var(--font-body);
            font-weight: 800;
            font-size: 84px;
            line-height: 0.98;
            letter-spacing: -0.045em;
            color: var(--ink);
        }

        h1 em {
            font-style: normal;
            color: var(--orange);
            position: relative;
            display: inline-block;
        }

        h1 em svg.hand-stroke {
            position: absolute;
            left: -1%;
            bottom: -0.08em;
            width: 102%;
            height: 0.14em;
            pointer-events: none;
        }

        h1 em svg.hand-stroke path {
            stroke: var(--orange);
            stroke-width: 5;
            stroke-linecap: round;
            fill: none;
            opacity: 0.5;
        }

        .sub {
            margin-top: 22px;
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 18px;
            white-space: nowrap;
        }

        .sub .sep {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--orange);
            opacity: 0.8;
        }

        /* Stats column */
        .stats {
            position: absolute;
            left: 1080px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 26px;
            padding-left: 36px;
            border-left: 1px solid var(--line);
        }

        .stat .num {
            font-family: var(--font-body);
            font-weight: 800;
            font-size: 60px;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--ink);
        }

        .stat .num span {
            color: var(--orange);
        }

        .stat .label {
            margin-top: 8px;
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
        }

        /* Photo card, right */
        .photo {
            position: absolute;
            right: 200px;
            top: 50%;
            transform: translateY(-50%);
            width: 470px;
            height: 278px;
            padding: 10px;
            background: #fff;
            border: 1px solid var(--line);
            box-shadow: 0 18px 40px rgba(10, 10, 10, 0.10);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 42%;
            display: block;
        }

    </style>
  <!-- Social share card (iMessage, Slack, LinkedIn, X) -->
  <meta property="og:image" content="https://www.finmango.org/og-image.png?v=20260924">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="FinMango — Financial health should be a right.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.finmango.org/og-image.png?v=20260924">
</head>

<body>
    <div class="banner" id="capture">
        <div class="glow"></div>
        <div class="glow two"></div>
        <div class="grid"></div>
        <div class="rule top"></div>
        <div class="rule bottom"></div>
        <div class="accent"></div>

        <div class="logo">
            <img src="finmango.png" alt="FinMango">
        </div>

        <div class="copy">
            <div class="eyebrow">501(c)(3) nonprofit · Est. 2017</div>
            <h1>Financial health<br>should be <em>a right<svg class="hand-stroke" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M4 8 C 50 3, 110 10, 160 6 S 260 4, 296 7"/></svg></em>.</h1>
            <div class="sub">
                <span>Research</span><span class="sep"></span>
                <span>Education</span><span class="sep"></span>
                <span>Advocacy</span><span class="sep"></span>
                <span>finmango.org</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="num">10M<span>+</span></div>
                <div class="label">Reached via open data</div>
            </div>
            <div class="stat">
                <div class="num">100K<span>+</span></div>
                <div class="label">High school students</div>
            </div>
        </div>

        <div class="photo">
            <img src="hero.jpg" alt="">
        </div>
    </div>
</body>

</html>
