<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barrier Breakers 2026 - Photo collage</title>
    <!-- Source for barrier-breakers-collage-2026.jpg. Wide (12:5) photo-only collage of
         event-day photos from March 20, 2026 for social posts, slides, and sponsor decks.
         Render at exactly 2400x1000:
         chromium --headless --window-size=2400,1000 --screenshot=barrier-breakers-collage-2026.png barrier-breakers-collage-2026.html -->
    <style>
        @page { size: 2400px 1000px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 2400px; height: 1000px; overflow: hidden; background: #0A0A0A; }
        .collage {
            width: 2400px; height: 1000px;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
            background: #0A0A0A;
        }
        .tile { position: relative; overflow: hidden; background: #1a1a1a; }
        .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .t1 { grid-column: 1 / 5;   grid-row: 1 / 3; }   /* cohort cheering with the flag, big anchor */
        .t2 { grid-column: 5 / 8;   grid-row: 1; }       /* poster pitch */
        .t3 { grid-column: 8 / 10;  grid-row: 1; }       /* Demo Day stage */
        .t4 { grid-column: 10 / 13; grid-row: 1; }       /* whole cohort on the staircase */
        .t5 { grid-column: 5 / 7;   grid-row: 2; }       /* judge at the table */
        .t6 { grid-column: 7 / 9;   grid-row: 2; }       /* awards handshake */
        .t7 { grid-column: 9 / 11;  grid-row: 2; }       /* Innovation Gallery winners */
        .t8 { grid-column: 11 / 13; grid-row: 2; }       /* mentors and judges with the flag */
    </style>
</head>
<body>
    <div class="collage">
        <div class="tile t1"><img src="images/barrier-breakers-2026/IMG_3829.jpg" alt="The Barrier Breakers 2026 cohort cheering with the FinMango flag" style="object-position: 50% 40%"></div>
        <div class="tile t2"><img src="images/barrier-breakers-2026/IMG_9143.jpg" alt="Students presenting their poster on unemployment" style="object-position: 50% 45%"></div>
        <div class="tile t3"><img src="images/barrier-breakers-2026/IMG_3825.JPEG" alt="A finalist presents on stage at Demo Day" style="object-position: 45% 60%"></div>
        <div class="tile t4"><img src="images/barrier-breakers-2026/IMG_3792.JPG" alt="The full cohort seated on the grand staircase" style="object-position: 50% 55%"></div>
        <div class="tile t5"><img src="images/barrier-breakers-2026/IMG_9151.jpg" alt="A student pitches to a judge at their table" style="object-position: 60% 50%"></div>
        <div class="tile t6"><img src="images/barrier-breakers-2026/IMG_3837.jpg" alt="Handshakes at the awards" style="object-position: 55% 40%"></div>
        <div class="tile t7"><img src="images/barrier-breakers-2026/IMG_3840.jpg" alt="Innovation Gallery award winners holding the FinMango flag" style="object-position: 50% 70%"></div>
        <div class="tile t8"><img src="images/barrier-breakers-2026/IMG_3834.jpg" alt="Mentors and judges holding the FinMango flag" style="object-position: 50% 80%"></div>
    </div>
</body>
</html>
