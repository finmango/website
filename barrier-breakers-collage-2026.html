<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barrier Breakers 2026 - Photo collage</title>
    <!-- Source for barrier-breakers-collage-2026.jpg. Wide (12:5) collage of event-day photos
         from March 20, 2026 for social posts, slides, and sponsor decks.
         Render at exactly 2400x1000:
         chromium --headless --window-size=2400,1000 --screenshot=barrier-breakers-collage-2026.png barrier-breakers-collage-2026.html -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,900&display=swap" rel="stylesheet">
    <style>
        @page { size: 2400px 1000px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 2400px; height: 1000px; overflow: hidden; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0A0A0A;
            color: #fff;
        }
        .collage {
            position: relative;
            width: 2400px; height: 1000px;
            display: grid;
            grid-template-columns: 520px repeat(12, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
            background: #0A0A0A;
        }
        .tile { position: relative; overflow: hidden; background: #1a1a1a; }
        .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Title panel */
        .title {
            grid-column: 1; grid-row: 1 / 3;
            background: #0A0A0A;
            border-left: 14px solid #F25A27;
            padding: 44px 40px 40px 42px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .logo { height: 46px; width: auto; filter: brightness(0) invert(1); display: block; }
        .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #F25A27; margin-bottom: 18px; }
        h1 { font-size: 104px; font-weight: 900; line-height: .92; letter-spacing: -.045em; }
        .year { color: #F25A27; }
        .sub { font-size: 25px; font-weight: 500; color: rgba(255,255,255,.82); margin-top: 24px; line-height: 1.3; letter-spacing: -.01em; }
        .stats { display: flex; gap: 34px; margin-top: 30px; }
        .stat .val { font-size: 42px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
        .stat .lab { font-size: 15px; font-weight: 500; color: rgba(255,255,255,.6); margin-top: 6px; }
        .foot { display: flex; flex-direction: column; gap: 8px; }
        .url { font-size: 22px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
        .url span { color: #F25A27; }
        .where { font-size: 18px; font-weight: 500; color: rgba(255,255,255,.6); }

        /* Mosaic: 12 columns x 2 rows to the right of the title */
        .t1 { grid-column: 2 / 7;  grid-row: 1 / 3; }            /* cohort with the flag, big anchor */
        .t2 { grid-column: 7 / 10; grid-row: 1; }               /* poster pitch */
        .t3 { grid-column: 10 / 12; grid-row: 1; }              /* Demo Day stage */
        .t4 { grid-column: 12 / 14; grid-row: 1; }              /* Innovation Gallery winners */
        .t5 { grid-column: 7 / 9;  grid-row: 2; }               /* judge at the table */
        .t6 { grid-column: 9 / 12; grid-row: 2; }               /* awards handshake */
        .t7 { grid-column: 12 / 14; grid-row: 2; }              /* mentors and judges with the flag */
    </style>
</head>
<body>
    <div class="collage">
        <div class="title">
            <img class="logo" src="finmango.png" alt="FinMango">
            <div>
                <div class="eyebrow">Financial Health Innovation Challenge</div>
                <h1>Barrier<br>Breakers<br><span class="year">2026</span></h1>
                <div class="sub">250 of Northeast Ohio's top high school students pitched fixes for the costs that hold families back.</div>
                <div class="stats">
                    <div class="stat"><div class="val">250</div><div class="lab">students</div></div>
                    <div class="stat"><div class="val">25+</div><div class="lab">high schools</div></div>
                    <div class="stat"><div class="val">$20K+</div><div class="lab">awarded</div></div>
                </div>
            </div>
            <div class="foot">
                <div class="where">March 20, 2026 · Northeast Ohio</div>
                <div class="url">finmango.org<span>/barrier-breakers</span></div>
            </div>
        </div>
        <div class="tile t1"><img src="images/barrier-breakers-2026/IMG_3829.jpg" alt="The Barrier Breakers 2026 cohort cheering with the FinMango flag" style="object-position: 50% 40%"></div>
        <div class="tile t2"><img src="images/barrier-breakers-2026/IMG_9143.jpg" alt="Students presenting their poster on unemployment" style="object-position: 50% 45%"></div>
        <div class="tile t3"><img src="images/barrier-breakers-2026/IMG_3825.JPEG" alt="A finalist presents on stage at Demo Day" style="object-position: 45% 60%"></div>
        <div class="tile t4"><img src="images/barrier-breakers-2026/IMG_3840.jpg" alt="Innovation Gallery award winners holding the FinMango flag" style="object-position: 50% 70%"></div>
        <div class="tile t5"><img src="images/barrier-breakers-2026/IMG_9151.jpg" alt="A student pitches to a judge at their table" style="object-position: 60% 50%"></div>
        <div class="tile t7"><img src="images/barrier-breakers-2026/IMG_3834.jpg" alt="Mentors and judges holding the FinMango flag" style="object-position: 50% 80%"></div>
        <div class="tile t6"><img src="images/barrier-breakers-2026/IMG_3837.jpg" alt="Handshakes at the awards" style="object-position: 50% 40%"></div>
    </div>
</body>
</html>
