<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Social card — AI Exposure, Wages, and Employment (Hans Patel)</title>
<style>
  /* Hand-made 1200x630 share card for one Ambassador Note. Same fonts and
     tokens as scripts/og-post-template.html; render with
     scripts/render-og-custom.js. Kept so the card can be re-made later. */
  @font-face {
    font-family: 'DM Sans';
    src: url('../fonts/dm-sans-var.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('../fonts/jetbrains-mono-500.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
  }
  :root {
    --paper: #FAFAF7;
    --ink: #0A0A0A;
    --orange: #F25A27;
    --ink-faint: rgba(10, 10, 10, .42);
    --ink-soft: rgba(10, 10, 10, .62);
    --ink-line-soft: rgba(10, 10, 10, .12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px;
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #capture {
    position: relative;
    width: 1200px; height: 630px;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 52px 64px 36px;
  }
  .text { flex: 1; min-width: 0; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
  }
  .eyebrow .tick { width: 24px; height: 2px; background: var(--orange); flex: none; }
  h1 {
    font-size: 70px;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -.025em;
    margin-bottom: 26px;
  }
  h1 em { font-style: normal; color: var(--orange); }
  .sub {
    font-size: 25px;
    line-height: 1.38;
    color: var(--ink-soft);
    max-width: 640px;
  }
  .photo {
    flex: none;
    width: 300px; height: 300px;
    border-radius: 40px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 0 rgba(10,10,10,.06), 0 18px 40px rgba(10,10,10,.10);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip {
    flex: none;
    height: 78px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 0 64px 4px;
    border-top: 1px solid var(--ink-line-soft);
  }
  .brand-logo { height: 30px; width: auto; display: block; }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 14px;
    white-space: nowrap;
  }
  .meta .tick { width: 24px; height: 2px; background: var(--orange); flex: none; }
</style>
</head>
<body>
<div id="capture">
  <div class="main">
    <div class="text">
      <div class="eyebrow"><span class="tick"></span>New report</div>
      <h1>More AI, <em>more jobs</em>, higher wages?</h1>
      <p class="sub">What the data really says about AI and work, and the one question that decides whether it helps or hurts.</p>
    </div>
    <div class="photo"><img src="../../36.jpg" alt="Hans Patel" /></div>
  </div>
  <div class="strip">
    <img class="brand-logo" src="../../finmango.png" alt="FinMango" />
    <div class="meta"><span class="tick"></span>Report · Hans Patel</div>
  </div>
</div>
</body>
</html>
