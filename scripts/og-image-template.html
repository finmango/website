<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FinMango OG Image</title>
<style>
  /* Local fonts so renders are hermetic (no network needed in CI/sandboxes). */
  @font-face { font-family: 'DM Sans'; src: url('fonts/dm-sans-var.woff2') format('woff2'); font-weight: 100 1000; font-style: normal; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/jetbrains-mono-500.woff2') format('woff2'); font-weight: 500; font-style: normal; }

  /* Editorial system — same tokens as index.html */
  :root {
    --paper: #FAFAF7; --ink: #0A0A0A; --orange: #F25A27;
    --ink-faint: rgba(10,10,10,.42); --ink-line: rgba(10,10,10,.12);
    --paper-faint: rgba(250,250,247,.5); --paper-line: rgba(250,250,247,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; background: var(--paper); color: var(--ink); }
  #capture { position: relative; width: 1200px; height: 630px; overflow: hidden; }

  .headline { font-weight: 900; letter-spacing: -.05em; line-height: .96; }
  .headline em { font-style: normal; color: var(--orange); position: relative; display: inline-block; white-space: nowrap; }
  .headline em svg.hand-stroke { position: absolute; left: -1%; bottom: -.06em; width: 102%; height: .14em; }
  .headline em svg.hand-stroke path { stroke: var(--orange); stroke-width: 5; stroke-linecap: round; fill: none; opacity: .5; }

  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; }
  .stats { display: flex; gap: 44px; }
  .stat { display: flex; flex-direction: column; gap: 9px; }
  .stat-num { font-weight: 900; letter-spacing: -.04em; line-height: .95; }
  .stat-num em { font-style: normal; color: var(--orange); }
  .url { display: flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: .1em; }
  .url .tick { width: 24px; height: 2px; background: var(--orange); display: inline-block; }

  /* Split: paper copy panel on the left, photo on the right */
  #capture { display: flex; }
  .panel { width: 640px; height: 630px; padding: 52px 56px 50px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
  .glow { position: absolute; left: -30%; bottom: -40%; width: 640px; height: 640px; background: radial-gradient(circle, rgba(242,90,39,.12) 0%, transparent 60%); filter: blur(40px); }
  .brand-row { position: relative; }
  .brand { height: 50px; width: auto; display: block; }
  .headline { font-size: 76px; position: relative; }
  .foot { position: relative; display: flex; flex-direction: column; gap: 26px; }
  .stat-num { font-size: 44px; }
  .stat-label { font-size: 11.5px; color: var(--ink-faint); }
  .url { color: var(--ink); padding-top: 22px; border-top: 1px solid var(--ink-line); }
  .photo { width: 560px; height: 630px; position: relative; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 62% center; display: block; }
</style>
</head>
<body>
<div id="capture">
  <div class="panel">
    <div class="glow"></div>
    <div class="brand-row"><img class="brand" src="../finmango.png" alt="FinMango" /></div>
    <h1 class="headline">Financial health should be <em>a right<svg class="hand-stroke" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M4 8 C 50 3, 110 10, 160 6 S 260 4, 296 7"/></svg></em>.</h1>
    <div class="foot">
      <div class="stats">
      <div class="stat"><div class="stat-num">10M<em>+</em></div><div class="stat-label mono">Reached via open data</div></div>
      <div class="stat"><div class="stat-num">100K<em>+</em></div><div class="stat-label mono">High school students in America</div></div>
    </div>
      <div class="url mono"><span class="tick"></span>finmango.org</div>
    </div>
  </div>
  <div class="photo"><img src="../hero.jpg" alt="" /></div>
</div>
</body>
</html>
